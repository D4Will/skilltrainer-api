services:
  db:
    image: postgres:18-alpine
    container_name: skilltrainer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skilltrainer_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env.production
    volumes:
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8000/authenticated/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - app_network
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn mysite.wsgi:application
             --bind 0.0.0.0:8000
             --workers $((2 * $(nproc) + 1))
             --threads 2
             --worker-class gthread"

  nginx:
    image: nginx:alpine
    container_name: skilltrainer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  static_volume:
  logs_volume:

networks:
  app_network:
    driver: bridge