  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   networks:
  #     - frontend

volumes:
  postgres-data:
    external: true
  static_volume:
  logs_volume:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
