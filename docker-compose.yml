services:
  db:
    image: postgres:18-alpine
    container_name: skilltrainer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${USER_NAME}
      POSTGRES_PASSWORD: ${USER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_NAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  web:
    build: .
    container_name: skilltrainer_web
    restart: unless-stopped
    env_file:
      - path: ./.env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "-H",
          "X-Forwarded-Proto: https",
          "http://localhost:8000/health/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:alpine
    container_name: skilltrainer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres-data:
    external: true
  static_volume:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
