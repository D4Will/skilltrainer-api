services:
  db:
    image: postgres:18-alpine
    container_name: skilltrainer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  web:
    build: .
    container_name: skilltrainer_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8000/authenticated/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - frontend
      - backend

  # nginx:
  #   image: nginx:alpine
  #   container_name: skilltrainer_nginx
  #   restart: unless-stopped
